apiVersion: v1
kind: Service
metadata:
  name: minio-basic
  labels:
    app: minio-basic
spec:
  type: NodePort
  selector:
    app: minio-basic
  ports:
    - protocol: TCP
      name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - protocol: TCP
      name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901